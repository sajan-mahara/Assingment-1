<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshBytes - Meal-Prep Delivery</title>
    <style>
        /* Base Reset & Variables */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --bg-color: #f9fbf9;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --border-color: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
        }

        /* Header & Touch-Optimized Nav */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
        }

        nav ul {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
        }

        /* Accessible, touch-friendly navigation links */
        nav a {
            display: inline-block;
            min-height: 44px;
            min-width: 44px;
            padding: 0.6rem 1rem;
            background-color: #e8f5e9;
            color: var(--primary-color);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
        }

        nav a:hover, nav a:focus {
            background-color: var(--primary-color);
            color: #ffffff;
            outline: none;
        }

        /* Responsive Layout Container */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h2 {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        /* Responsive Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .meal-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Responsive Fluid Image Handling */
        .meal-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .meal-info {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .meal-title {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .meal-price {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        /* Responsive Touch-Optimized Form Inputs */
        .order-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        select {
            width: 100%;
            min-height: 48px;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            outline: 2px solid var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            min-height: 48px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-submit:hover, .btn-submit:focus {
            background-color: var(--primary-hover);
        }

        /* Tablet & Desktop Layout Transitions */
        @media (min-width: 600px) {
            .header-container {
                flex-direction: row;
                justify-content: space-between;
            }

            .menu-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 900px) {
            .menu-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="#" class="logo">FreshBytes</a>
            <nav>
                <ul>
                    <li><a href="#menu">Weekly Menu</a></li>
                    <li><a href="#plans">Meal Plans</a></li>
                    <li><a href="#order">Order Now</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="menu">
            <h2>This Week's Featured Meals</h2>
            <div class="menu-grid">
                
                <article class="meal-card">
                    <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop" alt="Fresh Mediterranean bowl with quinoa, avocado, and chicken">
                    <div class="meal-info">
                        <div>
                            <h3 class="meal-title">Mediterranean Power Bowl</h3>
                            <p class="meal-price">$12.99</p>
                        </div>
                    </div>
                </article>

                <article class="meal-card">
                    <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=600&auto=format&fit=crop" alt="Grilled salmon served with brown rice and steamed broccoli">
                    <div class="meal-info">
                        <div>
                            <h3 class="meal-title">Grilled Salmon &amp; Greens</h3>
                            <p class="meal-price">$14.50</p>
                        </div>
                    </div>
                </article>

                <article class="meal-card">
                    <img src="https://images.unsplash.com/photo-1540420773420-3366772f4999?w=600&auto=format&fit=crop" alt="Tofu stir fry with mixed vegetables and peanut sauce">
                    <div class="meal-info">
                        <div>
                            <h3 class="meal-title">Vegan Tofu Stir-Fry</h3>
                            <p class="meal-price">$11.75</p>
                        </div>
                    </div>
                </article>

            </div>
        </section>

        <!-- Touch-Optimized Mobile Checkout Form -->
        <section id="order" class="order-section">
            <h2>Quick Delivery Checkout</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number (for SMS tracking)</label>
                    <input type="tel" id="phone" name="phone" required autocomplete="tel">
                </div>

                <div class="form-group">
                    <label for="meal-plan">Select Plan</label>
                    <select id="meal-plan" name="meal-plan" required>
                        <option value="">-- Select a plan --</option>
                        <option value="3-day">3 Days / 6 Meals</option>
                        <option value="5-day">5 Days / 10 Meals</option>
                        <option value="7-day">7 Days / 14 Meals</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Place Order</button>
            </form>
        </section>
    </main>

</body>
</html>
